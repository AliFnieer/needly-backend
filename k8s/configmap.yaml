apiVersion: v1
kind: ConfigMap
metadata:
  name: needly-config
  namespace: needly
  labels:
    app: needly
    app.kubernetes.io/part-of: needly
data:
  DB_HOST: "needly-postgres"
  DB_PORT: "5432"
  DB_NAME: "needly"
  DB_SSLMODE: "disable"
  DB_TIMEZONE: "UTC"
  REDIS_HOST: "needly-redis"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  GIN_MODE: "release"
  SERVER_PORT: "8080"
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  CORS_ALLOWED_METHODS: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
  CORS_ALLOWED_HEADERS: "Authorization,Content-Type,Accept"
  CORS_ALLOW_CREDENTIALS: "true"
  CORS_MAX_AGE: "3600"
