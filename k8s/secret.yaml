apiVersion: v1
kind: Secret
metadata:
  name: needly-secret
  namespace: needly
  labels:
    app: needly
    app.kubernetes.io/part-of: needly
type: Opaque
stringData:
  DB_USER: "needly_user"
  DB_PASSWORD: "CHANGE_ME_db_password"
  JWT_SECRET: "CHANGE_ME_jwt_secret_at_least_32_chars"
  JWT_EXPIRY_HOURS: "72"
  REDIS_PASSWORD: "CHANGE_ME_redis_password"
  CORS_ALLOWED_ORIGINS: "https://needly.com,https://app.needly.com"
