version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: needly-api
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - needly-network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: needly-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: needly
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d needly"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - needly-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: needly-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - needly-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  needly-network:
    driver: bridge